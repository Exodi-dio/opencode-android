[versions]
# Toolchain pins (docs/parity.md "toolchain pins" row).
kotlin = "2.0.21"
agp = "8.5.2"
# KSP build matching Kotlin 2.0.21 (derived, not a Task 1 pin).
ksp = "2.0.21-1.0.25"
# Library pins (docs/parity.md "library pins" row).
hilt = "2.51.1"
room = "2.6.1"
ktor = "2.3.12"
serialization = "1.7.3"
coroutines = "1.9.0"
jgit = "6.10.0"
composeBom = "2024.09.00"
junit4 = "4.13.2"
robolectric = "4.13"
androidx-test-junit = "1.2.1"
test-runner = "1.6.1"
espresso = "3.6.1"
paparazzi = "1.3.2"
roborazzi = "1.27.0"
ktlint = "12.1.2"
detekt = "1.23.7"
# SDK pins (docs/parity.md "toolchain pins" + "native/SDK pins" rows).
compileSdk = "35"
targetSdk = "35"
minSdk = "26"
ndk = "27.2.12479018"

[libraries]
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Dependency only until M4/M6 (docs/parity.md); present in catalog, unused by modules in M1.
jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# M1 instrumented smoke (LaunchTest, emulator/scenarios workflows).
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "test-runner" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
paparazzi = { group = "app.cash.paparazzi", name = "paparazzi", version.ref = "paparazzi" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# M1 lint gate plugins (versions pinned above; applied in root build.gradle.kts).
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
