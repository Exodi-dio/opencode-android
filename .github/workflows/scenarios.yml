# M1 scenarios stub: mock-LLM E2E on a cloud emulator.
# Triggered manually with a `scenario` input (default launch-and-quit).
# Cloud-only: ubuntu-latest runners with KVM. Nothing executes locally.
#
# Setup steps (checkout, JDK 21, manual SDK install, wrapper generation) are
# copied verbatim from ci.yml -- NEVER use the obsolete android-actions setup
# action (removed `tools` package).

name: scenarios

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (mock LLM, emulator)"
        required: false
        default: launch-and-quit
        type: string

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.10.2
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: 35.0.0
  NDK_VERSION: 27.2.12479018

jobs:
  scenario:
    name: scenario (${{ inputs.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOCK_LLM: "1"
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "ndk;${{ env.NDK_VERSION }}"
      - name: Generate Gradle wrapper (pinned 8.10.2)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mock-LLM E2E (${{ inputs.scenario }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedCheck -Pscenario=${{ inputs.scenario }}
      - name: Capture scenario video and logs
        if: always()
        run: |
          mkdir -p scenario-artifacts
          adb logcat -d > scenario-artifacts/logcat.txt || true
          adb exec-out screencap -p > scenario-artifacts/screenshot.png || true
          adb shell screenrecord --time-limit 30 /sdcard/scenario.mp4
          adb pull /sdcard/scenario.mp4 scenario-artifacts/scenario.mp4 || true
      - name: Upload scenario video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ inputs.scenario }}
          path: scenario-artifacts/
          if-no-files-found: warn
          retention-days: 14
