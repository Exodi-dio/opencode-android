# M1 emulator gate: instrumented tests on cloud emulators + weak-hardware smoke.
# Cloud-only: ubuntu-latest runners with KVM. Nothing executes locally.
#
# Setup steps (checkout, JDK 21, manual SDK install, wrapper generation) are
# copied verbatim from ci.yml -- NEVER use the obsolete android-actions setup
# action (removed `tools` package).

name: emulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.10.2
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: 35.0.0
  NDK_VERSION: 27.2.12479018

jobs:
  instrumented:
    name: instrumented (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # 35 == latest pinned (env ANDROID_API); x86_64 throughout.
      matrix:
        api-level: [30, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "ndk;${{ env.NDK_VERSION }}"
      - name: Generate Gradle wrapper (pinned 8.10.2)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (API ${{ matrix.api-level }}, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedCheck
      - name: Capture emulator artifacts
        if: always()
        run: |
          mkdir -p emulator-artifacts
          adb logcat -d > emulator-artifacts/logcat.txt || true
          adb exec-out screencap -p > emulator-artifacts/screenshot.png || true
          adb shell uiautomator dump /sdcard/window_dump.xml || true
          adb pull /sdcard/window_dump.xml emulator-artifacts/hierarchy.xml || true
          adb shell screenrecord --time-limit 30 /sdcard/recording.mp4
          adb pull /sdcard/recording.mp4 emulator-artifacts/recording.mp4 || true
          adb pull /data/tombstones emulator-artifacts/tombstones || true
      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api${{ matrix.api-level }}
          path: emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14

  low-ram:
    name: low-ram smoke (API 30, 2 GB)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Weak-hardware smoke profile: 2 GB RAM, 512M VM heap (see emulator-options
    # plus EMULATOR_VM_HEAP below; Task 7 may promote this to a dedicated AVD).
    env:
      EMULATOR_VM_HEAP: 512M
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "ndk;${{ env.NDK_VERSION }}"
      - name: Generate Gradle wrapper (pinned 8.10.2)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Weak-hardware smoke (API 30, 2 GB RAM, heap 512M)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 4
          emulator-boot-timeout: 900
          emulator-options: -memory 2048 -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedCheck
      - name: Capture emulator artifacts
        if: always()
        run: |
          mkdir -p emulator-artifacts
          adb logcat -d > emulator-artifacts/logcat.txt || true
          adb exec-out screencap -p > emulator-artifacts/screenshot.png || true
          adb shell uiautomator dump /sdcard/window_dump.xml || true
          adb pull /sdcard/window_dump.xml emulator-artifacts/hierarchy.xml || true
          adb shell screenrecord --time-limit 30 /sdcard/recording.mp4
          adb pull /sdcard/recording.mp4 emulator-artifacts/recording.mp4 || true
          adb pull /data/tombstones emulator-artifacts/tombstones || true
      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-low-ram-api30
          path: emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14
