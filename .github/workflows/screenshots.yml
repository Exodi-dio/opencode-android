# M1 screenshot gate (skeleton): Paparazzi verify + Roborazzi compare.
# Cloud-only: ubuntu-latest runners. Diffs upload always and are posted as a
# PR comment. Pre-Task-7 there are no snapshot tests, so the verify steps are
# continue-on-error (never fail M1); Task 7 promotes them to hard gates.
#
# Setup steps (checkout, JDK 21, manual SDK install, wrapper generation) are
# copied verbatim from ci.yml -- NEVER use the obsolete android-actions setup
# action (removed `tools` package).

name: screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.10.2
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: 35.0.0
  NDK_VERSION: 27.2.12479018

jobs:
  snapshots:
    name: snapshots (Paparazzi + Roborazzi)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_API }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "ndk;${{ env.NDK_VERSION }}"
      - name: Generate Gradle wrapper (pinned 8.10.2)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Paparazzi verify
        # M1 skeleton: no snapshot tests yet (Task 7); never fail M1.
        continue-on-error: true
        uses: gradle/gradle-build-action@v3
        with:
          arguments: verifyPaparazziDebug
      - name: Roborazzi compare
        # M1 skeleton: no snapshot tests yet (Task 7); never fail M1.
        continue-on-error: true
        uses: gradle/gradle-build-action@v3
        with:
          arguments: compareRoborazziDebug
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            **/build/paparazzi/failures/
            **/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 14

  comment:
    name: comment diffs on PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [snapshots]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post screenshot diff comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Screenshot diffs (M1 skeleton)
            Paparazzi verify + Roborazzi compare ran for this PR.
            Diffs (if any) are in the `screenshot-diffs` artifact of this run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Pre-Task-7 there are no snapshot tests, so an empty diff set is expected.
